# E2E testing overlay — always use with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml <cmd>
# Adds healthchecks (required for --wait), fixes the JWT signing key, and
# ensures postgres is healthy before dependent services start.
# Run `docker compose ... down -v` to remove the named pgdata volume between runs.
name: proxytrace-e2e

services:
  postgres:
    ports: !reset
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxytrace -d proxytrace"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    ports: !reset []

  api:
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /api/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q status <&3'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - Authentication__Mode=Local
      - Authentication__Local__SigningKey=e2e-test-signing-key-32-chars-min!
      # Enables the test-support/seed endpoints (gated off in real deployments via TestOnlyEndpoint).
      - TestSupport__Enabled=true
      # E2e specs seed data and immediately assert it on the dashboard; the server-side dashboard
      # cache (default 10s) would serve a pre-seed payload and flake those assertions. Disable it.
      - Statistics__DashboardCacheTtlSeconds=0
      # Every spec authenticates its own ProxytraceApiClient, so a run drives ~80 real logins in a
      # few minutes — and they all arrive from one source address, which is precisely the partition
      # the per-IP auth-login limiter counts. The whole suite therefore shares a single 30/min
      # bucket and the tail of the run 429s. Lift the budget for the test stack only; the shipped
      # default in appsettings.json is untouched. See AuthRateLimiterConfigurator.
      - RateLimiting__Login__PermitLimit=100000
      # Throwaway Enterprise support key signed (ES256, kid 2026-05) with the TEST private key,
      # so the support-key spec can exercise the "key on file" path. This stack's images are
      # built with the LICENSE_PUBLIC_KEY build-arg baking in the matching test public key (see
      # docs/licensing.md). Official release images embed the production key and reject this
      # token, so committing it grants nothing — and nothing is gated on it anyway.
      - PROXYTRACE_LICENSE=eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6IjIwMjYtMDUifQ..u6J5NJhOP7EUA2tKbRKQcs7T8gmPqXuwGIXiAIUpujUs1zikc-QCbK0x0y2dJWzd_ZIE4GlZgH1aaEGG1EaH_w

  proxy:
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    depends_on:
      api:
        condition: service_healthy
